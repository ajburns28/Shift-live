<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>14U OKC Blazers — Live | SHIFT Live</title>
<meta name="description" content="Watch the 14U OKC Blazers live, full-ice, straight from the rink." />

<script src="https://unpkg.com/@mux/mux-player"></script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Text:wght@400;500;700;900&display=swap" rel="stylesheet">

<!-- Inlined rather than a separate style.css -- see index.html's matching
     comment for why (the shared stylesheet 404'd on first deploy and
     silently killed all styling on both pages). -->
<style>
/* SHIFT LIVE -- shared styles
   Colors mirrored 1:1 from the native app's SHIFTBrand.swift (SHIFT
   Design System v1.0) so this site matches Capture/SHIFT exactly rather
   than drifting on its own palette. Typeface (Big Shoulders Text) is the
   same one too -- free, Google Fonts, SIL Open Font License. */

:root {
  --bg: #090B10;
  --card: #12161D;
  --card-hover: #171C25;
  --border: #313844;
  --ice-blue: #BFDFFF;
  --shift-blue: #2D8CFF;
  --text: #FFFFFF;
  --muted: #8A919C;
  --error: #E5484D;
}

* { box-sizing: border-box; }

html {
  scroll-behavior: smooth;
}

body {
  margin: 0;
  min-height: 100vh;
  min-height: 100dvh;
  background: var(--bg);
  color: var(--text);
  font-family: "Big Shoulders Text", "Helvetica Neue", Arial, sans-serif;
  -webkit-font-smoothing: antialiased;
  display: flex;
  flex-direction: column;
}

/* Subtle rink-ice texture -- a faint diagonal hatch, not an image asset --
   so the background reads as "ice under stadium lights" without needing
   a real photo. Very low opacity, purely atmospheric. */
body {
  background-image:
    radial-gradient(circle at 15% 0%, rgba(45, 140, 255, 0.10), transparent 45%),
    radial-gradient(circle at 100% 20%, rgba(191, 223, 255, 0.06), transparent 40%),
    repeating-linear-gradient(135deg, rgba(255,255,255,0.015) 0px, rgba(255,255,255,0.015) 1px, transparent 1px, transparent 34px);
  background-attachment: fixed;
}

a { color: inherit; text-decoration: none; }

.wrap {
  width: 100%;
  max-width: 1080px;
  margin: 0 auto;
  padding: 0 24px;
}

/* ---------- Header ---------- */

.site-header {
  padding: 22px 0;
  border-bottom: 1px solid var(--border);
}

.site-header .wrap {
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.brand {
  display: flex;
  align-items: baseline;
  gap: 8px;
  font-weight: 900;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  font-size: 20px;
}

.brand .dot {
  color: var(--shift-blue);
}

.brand small {
  font-weight: 500;
  letter-spacing: 0.14em;
  font-size: 11px;
  color: var(--muted);
}

.site-header nav a {
  font-weight: 500;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  font-size: 13px;
  color: var(--muted);
  transition: color 0.15s ease;
}

.site-header nav a:hover {
  color: var(--ice-blue);
}

/* ---------- Footer ---------- */

.site-footer {
  margin-top: auto;
  padding: 28px 0 34px;
  border-top: 1px solid var(--border);
}

.site-footer .wrap {
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 10px;
}

.site-footer, .site-footer a {
  font-size: 12px;
  color: var(--muted);
  letter-spacing: 0.02em;
}

.site-footer a:hover {
  color: var(--ice-blue);
}

/* ---------- Buttons ---------- */

.btn {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  font-family: inherit;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  font-size: 14px;
  padding: 13px 24px;
  border-radius: 10px;
  border: none;
  cursor: pointer;
  transition: transform 0.15s ease, filter 0.15s ease;
}

.btn:hover { filter: brightness(1.08); transform: translateY(-1px); }
.btn:active { transform: translateY(0); }

.btn-primary {
  background: var(--ice-blue);
  color: #050609;
}

.btn-ghost {
  background: transparent;
  color: var(--text);
  border: 1px solid var(--border);
}

.btn-ghost:hover { border-color: var(--shift-blue); }

/* ---------- Live badge (shared by home + team pages) ---------- */

.live-badge {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  font-size: 11px;
  padding: 5px 11px;
  border-radius: 999px;
  background: rgba(229, 72, 77, 0.12);
  color: var(--error);
  border: 1px solid rgba(229, 72, 77, 0.35);
}

.live-badge.offline {
  background: rgba(138, 145, 156, 0.10);
  color: var(--muted);
  border-color: var(--border);
}

.live-dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: currentColor;
}

.live-badge:not(.offline) .live-dot {
  animation: pulse 1.4s ease-in-out infinite;
}

@keyframes pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.35; }
}
</style>

<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2222%22 fill=%22%23090B10%22/><text x=%2250%22 y=%2268%22 font-size=%2260%22 font-weight=%22900%22 text-anchor=%22middle%22 fill=%22%23BFDFFF%22 font-family=%22Arial,sans-serif%22>S</text></svg>">

<style>
  main { flex: 1; padding: 40px 0 70px; }

  .team-header {
    display: flex;
    align-items: center;
    gap: 18px;
    margin-bottom: 26px;
    flex-wrap: wrap;
  }

  .team-crest-lg {
    width: 64px;
    height: 64px;
    border-radius: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(155deg, rgba(45,140,255,0.18), rgba(191,223,255,0.08));
    border: 1px solid var(--border);
    font-weight: 900;
    font-size: 22px;
    color: var(--ice-blue);
    flex-shrink: 0;
  }

  .team-header .team-league {
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--muted);
    margin-bottom: 4px;
  }

  .team-header h1 {
    margin: 0;
    font-size: clamp(26px, 5vw, 40px);
    font-weight: 900;
    text-transform: uppercase;
    letter-spacing: 0.01em;
  }

  .player-frame {
    width: 100%;
    border-radius: 14px;
    overflow: hidden;
    border: 1px solid var(--border);
    background: var(--card);
    position: relative;
  }

  mux-player {
    width: 100%;
    aspect-ratio: 16 / 9;
    display: block;
    --media-object-fit: contain;
    --media-background-color: #000;
  }

  .status-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-top: 14px;
  }

  .hint {
    font-size: 12px;
    color: var(--muted);
  }

  .offline-note {
    margin-top: 16px;
    padding: 16px 18px;
    border-radius: 12px;
    background: var(--card);
    border: 1px solid var(--border);
    color: var(--muted);
    font-size: 13px;
    line-height: 1.6;
    text-align: center;
    display: none;
  }

  .offline-note.visible { display: block; }

  .offline-note strong { color: var(--text); }
</style>
</head>
<body>

  <header class="site-header">
    <div class="wrap">
      <a class="brand" href="/">SHIFT<span class="dot">.</span><small>LIVE</small></a>
      <nav>
        <a href="/">← All Teams</a>
      </nav>
    </div>
  </header>

  <main>
    <div class="wrap">
      <div class="team-header">
        <div class="team-crest-lg">14U</div>
        <div>
          <div class="team-league">Youth AA · Oklahoma City</div>
          <h1>OKC Blazers</h1>
        </div>
      </div>

      <div class="player-frame">
        <mux-player
          playback-id="6UzjZ7JVsVNL6XLzWEdBIR5fr02SNTpyzMV2aBjz02ZsU"
          stream-type="live"
          autoplay
          muted
          playsinline
          default-hidden-captions
          primary-color="#BFDFFF"
          accent-color="#2D8CFF"
        ></mux-player>
      </div>

      <div class="status-row">
        <span id="liveBadge" class="live-badge offline">
          <span class="live-dot"></span>
          <span id="liveBadgeText">Checking…</span>
        </span>
        <span class="hint">Tap the video to unmute</span>
      </div>

      <div id="offlineNote" class="offline-note">
        No stream right now — <strong>this page updates automatically</strong> as soon as the Blazers go live. Bookmark it and check back on game day.
      </div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="wrap">
      <span>© <span id="year"></span> SHIFT Live</span>
      <span>Powered by SHIFT</span>
    </div>
  </footer>

  <script>
    document.getElementById('year').textContent = new Date().getFullYear();

    // Reflects mux-player's own connection/error state into the badge
    // above, rather than assuming "live" the moment the page loads --
    // this page is meant to be left bookmarked between games, so it needs
    // to look right both while something is actually broadcasting and
    // while nothing is. mux-player retries the manifest on its own when
    // the stream isn't up yet -- no custom polling needed here.
    const player = document.querySelector('mux-player');
    const badge = document.getElementById('liveBadge');
    const badgeText = document.getElementById('liveBadgeText');
    const offlineNote = document.getElementById('offlineNote');

    function setLive(isLive) {
      badge.classList.toggle('offline', !isLive);
      badgeText.textContent = isLive ? 'Live' : 'Offline';
      offlineNote.classList.toggle('visible', !isLive);
    }

    setLive(false);

    player.addEventListener('playing', () => setLive(true));
    player.addEventListener('waiting', () => setLive(true)); // buffering mid-stream still counts as live
    player.addEventListener('error', () => setLive(false));
    player.addEventListener('stalled', () => setLive(false));
  </script>

</body>
</html>
